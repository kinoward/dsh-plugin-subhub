<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img">
<title>Dsh Plugin Subhub</title>
<desc>Bring your own subscription.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070914"/><stop offset="0.52" stop-color="#0A0D1B"/><stop offset="1" stop-color="#080A13"/>
  </linearGradient>
  <radialGradient id="violetGlow" cx="73%" cy="49%" r="42%">
    <stop offset="0" stop-color="#715CFF" stop-opacity=".23"/><stop offset=".45" stop-color="#604CFF" stop-opacity=".08"/><stop offset="1" stop-color="#604CFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="cyanGlow" cx="82%" cy="46%" r="28%">
    <stop offset="0" stop-color="#46D8FF" stop-opacity=".15"/><stop offset="1" stop-color="#46D8FF" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8D7BFF"/><stop offset=".5" stop-color="#6256FF"/><stop offset="1" stop-color="#36C8FF"/>
  </linearGradient>
  <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#695BFF"/><stop offset=".55" stop-color="#7B6DFF"/><stop offset="1" stop-color="#42D8FF"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1.35" fill="#65708A" opacity=".12"/>
  </pattern>
</defs>

<rect width="1600" height="520" rx="32" fill="url(#bg)"/>
<rect width="1600" height="520" rx="32" fill="url(#dots)" opacity=".45"/>
<rect width="1600" height="520" rx="32" fill="url(#violetGlow)"/>
<rect width="1600" height="520" rx="32" fill="url(#cyanGlow)"/>

<!-- left copy -->
<g transform="translate(92,66)">
  <rect x="0" y="18" width="185" height="34" rx="17" fill="#111528" stroke="#7568FF" stroke-opacity=".42"/>
  <circle cx="19" cy="35" r="4" fill="#6A5BFF" filter="url(#glow)"/>
  <text x="33" y="40" fill="#BFB8FF" font-family="Inter, system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing=".5">DeepSeek Harness</text>

  <text x="0" y="124" fill="url(#iris)" font-family="Inter, system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="760" letter-spacing="-1.2">Dsh Plugin Subhub</text>

  <text x="2" y="190" fill="#F7F8FF" font-family="Inter, system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="700" letter-spacing="-.6">Bring your own subscription.</text>
  <text x="2" y="234" fill="#B8C0D4" font-family="Inter, system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500">Third-party subscription accounts inside DeepSeek Harness.</text>
  <text x="2" y="274" fill="#8A94AB" font-family="Inter, system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500">Currently supports OpenAI / ChatGPT subscriptions only</text>
  <text x="2" y="298" fill="#6B7590" font-family="Inter, system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500">More subscription services are planned</text>

  <g transform="translate(2,374)">
    <path d="M0 0 H422" stroke="#252A3C"/>
    <text x="0" y="38" fill="#5F6880" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5">https://github.com/kinoward/dsh-plugin-subhub</text>
  </g>
</g>

